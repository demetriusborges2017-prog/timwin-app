<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>timwin</title>
<meta name="theme-color" content="#10283e" />
<link rel="icon" href="favicon.ico" sizes="any" />
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="manifest" href="manifest.json" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="timwin" />
<meta name="mobile-web-app-capable" content="yes" />
<style>
  :root{
    --navy:#10283e; --navy-2:#1c3a56; --amber:#be7931; --bg:#eef1f4; --card:#ffffff;
    --ink:#132433; --muted:#6a7787; --line:#e3e8ee; --user:#10283e; --wrap:780px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--ink);
    display:flex; flex-direction:column; height:100dvh; overflow:hidden;
  }
  .wrap{width:100%; max-width:var(--wrap); margin:0 auto}

  header{background:var(--navy); color:#fff; box-shadow:0 1px 0 rgba(0,0,0,.08)}
  .hbar{display:flex; align-items:center; gap:12px; padding:calc(env(safe-area-inset-top) + 12px) 18px 12px}
  .brand{display:flex; align-items:center; gap:11px; min-width:0}
  .mark{width:42px;height:42px;border-radius:11px;background:rgba(255,255,255,.10);
    display:flex;align-items:center;justify-content:center;flex:0 0 42px}
  .mark svg{width:26px;height:auto;display:block}
  .bname{font-size:18px;font-weight:600;line-height:1.05;letter-spacing:.2px}
  .bsub{font-size:12px;opacity:.8;margin-top:2px}
  .hright{margin-left:auto;display:flex;align-items:center;gap:9px}
  .env{font-size:11px;font-weight:600;padding:4px 9px;border-radius:20px;
    background:rgba(190,121,49,.20);color:#f0c191;border:1px solid rgba(190,121,49,.35)}
  .user{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.12);
    display:flex;align-items:center;justify-content:center;font-size:14px;opacity:.7}
  .disc{display:flex;align-items:center;gap:7px;padding:0 18px 12px}
  .discbadge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;
    background:rgba(255,255,255,.10);padding:5px 11px;border-radius:8px}
  .discbadge .dot{width:7px;height:7px;border-radius:50%;background:var(--amber)}

  main{flex:1; overflow-y:auto; padding:18px 16px}
  .toolbar{margin-bottom:14px; display:flex; align-items:center; justify-content:space-between; gap:10px; min-height:30px}
  .acaobadge{display:none; align-items:center; gap:8px; font-size:12.5px; font-weight:600; color:var(--navy);
    background:#fff; border:1px solid var(--line); padding:6px 12px; border-radius:20px}
  .acaobadge .dot{width:7px;height:7px;border-radius:50%;background:var(--amber)}
  .acaobadge a{color:var(--muted); font-weight:500; text-decoration:underline; cursor:pointer; margin-left:4px}
  .newconv{font-size:12px; color:var(--muted); text-decoration:underline; cursor:pointer; background:none; border:0; padding:4px; margin-left:auto}
  #thread{display:flex;flex-direction:column;gap:11px;min-height:100%}
  .row{display:flex}
  .row.me{justify-content:flex-end}
  .bubble{max-width:88%;font-size:14.5px;line-height:1.55;padding:11px 14px;border-radius:16px;
    word-wrap:break-word;white-space:normal}
  .row.bot .bubble{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:5px;box-shadow:0 1px 2px rgba(16,40,62,.04)}
  .row.me .bubble{background:var(--user);color:#fff;border-bottom-right-radius:5px}
  .bubble strong{font-weight:600}
  .typing{display:inline-flex;gap:7px;align-items:center;padding:12px 15px;color:var(--muted);font-size:13.5px}
  .dots{display:inline-flex;gap:4px}
  .dots i{width:7px;height:7px;border-radius:50%;background:#b6c2cd;display:inline-block;animation:b 1s infinite}
  .dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
  @keyframes b{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
  /* baloes de sugestao adaptada, abaixo da resposta */
  .suggchips{display:flex;flex-wrap:wrap;gap:7px;margin:-2px 2px 2px}
  .suggchips button{border:1px solid var(--line);background:#fff;color:var(--navy);font-size:12.5px;
    padding:8px 12px;border-radius:16px;cursor:pointer;font-weight:500;line-height:1.3;
    box-shadow:0 1px 4px rgba(16,40,62,.08)}
  .suggchips button::before{content:"\2192";color:var(--amber);font-weight:700;margin-right:6px}
  .suggchips button:hover{border-color:#c9d4de}
  /* botoes de confirmacao/escolha - mais destacados que as sugestoes, porque travam o fluxo */
  .quickreplies{display:flex;flex-wrap:wrap;gap:8px;margin:-2px 2px 4px}
  .quickreplies button{border:1.5px solid var(--navy);background:var(--navy);color:#fff;font-size:13px;
    padding:9px 15px;border-radius:20px;cursor:pointer;font-weight:600;line-height:1.3;
    box-shadow:0 1px 4px rgba(16,40,62,.12)}
  .quickreplies button.secondary{background:#fff;color:var(--navy)}
  .quickreplies button:hover{opacity:.9}
  .empty{margin:auto;text-align:center;padding:24px 22px;max-width:440px}
  .empty .glyph{width:64px;height:64px;border-radius:16px;background:var(--navy);
    display:flex;align-items:center;justify-content:center;margin:0 auto 16px}
  .empty .glyph svg{width:38px;height:auto}
  .empty h2{margin:0 0 6px;font-size:19px;font-weight:600;color:var(--ink)}
  .empty p{margin:0;color:var(--muted);font-size:14px;line-height:1.6}

  .suggest{background:var(--card);border-top:1px solid var(--line);padding:12px 16px 6px}
  .suggest .lbl{font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--muted);margin:0 2px 9px}
  #starters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
  #starters button{text-align:left;border:1px solid var(--line);background:#fbfcfd;color:var(--navy);
    font-size:13px;font-weight:500;padding:11px 13px;border-radius:11px;cursor:pointer;line-height:1.35}
  #starters button:hover{border-color:#c9d4de;background:#fff}

  .composer-wrap{background:var(--card);border-top:1px solid var(--line);padding:10px 16px 6px}
  .composer{display:flex;gap:9px;align-items:flex-end}
  .iconbtn{width:40px;height:40px;flex:0 0 40px;border:1px solid var(--line);border-radius:12px;background:#fff;
    color:var(--muted);font-size:20px;cursor:not-allowed;display:flex;align-items:center;justify-content:center;opacity:.6}
  textarea{flex:1;resize:none;border:1px solid var(--line);border-radius:14px;padding:11px 14px;
    font:inherit;font-size:15px;max-height:130px;outline:none;background:#fff;line-height:1.4}
  textarea:focus{border-color:var(--navy-2)}
  textarea:disabled{background:#f4f6f8;color:#aeb8c2}
  .send{width:44px;height:44px;flex:0 0 44px;border:0;border-radius:12px;background:var(--navy);color:#fff;
    font-size:19px;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .send:disabled{opacity:.45}

  footer{background:var(--card);border-top:1px solid var(--line);
    padding:9px 18px calc(env(safe-area-inset-bottom) + 9px);font-size:11.5px;color:var(--muted)}
  footer .ver{font-weight:600;color:var(--navy)}
  footer .fenv{padding:2px 8px;border-radius:12px;background:#f0e2d3;color:#8a5a1f;font-weight:600}
  footer .links{margin-left:auto;display:flex;gap:14px}
  footer .links a{color:var(--muted);text-decoration:none}
</style>
</head>
<body>

  <!-- 1. HEADER -->
  <header>
    <div class="hbar wrap">
      <div class="brand">
        <span class="mark" aria-hidden="true">
          <svg viewBox="0 0 574 344" xmlns="http://www.w3.org/2000/svg">
            <g fill="#ffffff">
              <rect x="0" y="0" width="100" height="100" rx="10"/><rect x="122" y="0" width="100" height="100" rx="10"/>
              <rect x="0" y="122" width="100" height="100" rx="10"/><rect x="122" y="122" width="100" height="100" rx="10"/>
              <rect x="0" y="244" width="100" height="100" rx="10"/><rect x="122" y="244" width="100" height="100" rx="10"/>
              <rect x="404" y="30" width="170" height="40" rx="16"/>
              <rect x="244" y="134" width="330" height="76" rx="20"/>
              <rect x="244" y="256" width="330" height="76" rx="20"/>
            </g>
            <rect x="244" y="0" width="100" height="100" rx="10" fill="#be7931"/>
          </svg>
        </span>
        <div>
          <div class="bname">timwin</div>
          <div class="bsub">Assistente Comercial Inteligente</div>
        </div>
      </div>
      <div class="hright">
        <span class="env" id="env-chip">Beta</span>
        <span class="user" title="Usuario" aria-hidden="true">&#9679;</span>
      </div>
    </div>
    <div class="disc wrap">
      <span class="discbadge"><span class="dot"></span>Automação Industrial</span>
    </div>
  </header>

  <!-- 2. MAIN / CHAT -->
  <main>
    <div class="wrap">
      <div class="toolbar">
        <span class="acaobadge" id="acaobadge"><span class="dot"></span><span id="acaobadge-text"></span><a id="trocar-acao">trocar</a></span>
        <button class="newconv" id="newconv" type="button">Nova conversa</button>
      </div>
      <div id="thread">
        <div class="empty" id="hint">
          <div class="glyph" aria-hidden="true">
            <svg viewBox="0 0 574 344" xmlns="http://www.w3.org/2000/svg">
              <g fill="#ffffff">
                <rect x="0" y="0" width="100" height="100" rx="10"/><rect x="122" y="0" width="100" height="100" rx="10"/>
                <rect x="0" y="122" width="100" height="100" rx="10"/><rect x="122" y="122" width="100" height="100" rx="10"/>
                <rect x="0" y="244" width="100" height="100" rx="10"/><rect x="122" y="244" width="100" height="100" rx="10"/>
                <rect x="404" y="30" width="170" height="40" rx="16"/>
                <rect x="244" y="134" width="330" height="76" rx="20"/>
                <rect x="244" y="256" width="330" height="76" rx="20"/>
              </g>
              <rect x="244" y="0" width="100" height="100" rx="10" fill="#be7931"/>
            </svg>
          </div>
          <h2>Qual é o desafio de hoje?</h2>
          <p id="hint-text">Conte rapidamente o que você pretende fazer, e eu ajudo a preparar a melhor abordagem.</p>
        </div>
      </div>
    </div>
  </main>

  <!-- 3. SUGESTOES RAPIDAS (some apos a primeira mensagem) -->
  <div class="suggest" id="suggest">
    <div class="wrap">
      <p class="lbl">Para começar</p>
      <div id="starters"></div>
    </div>
  </div>

  <!-- 4. ENTRADA -->
  <div class="composer-wrap">
    <div class="wrap">
      <div class="composer">
        <button class="iconbtn" type="button" title="Áudio (em breve)" aria-label="Áudio (em breve)" disabled>&#127908;</button>
        <textarea id="input" rows="1" placeholder="Escreva o que você pretende fazer..." autocomplete="off"></textarea>
        <button class="send" id="send" aria-label="Enviar">&#8593;</button>
      </div>
    </div>
  </div>

  <!-- 5. FOOTER -->
  <footer>
    <div class="wrap" style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
      <span class="ver" id="footer">timwin</span>
      <span class="fenv">Ambiente: Beta</span>
      <span class="links">
        <a href="#" onclick="return false">Ajuda</a>
        <a href="#" onclick="return false">Privacidade</a>
      </span>
    </div>
  </footer>

<script src="config.js"></script>
<script>
  var C = window.CONFIG || {};
  var WEBHOOK = C.WEBHOOK || "";
  var DISCIPLINA = C.DISCIPLINA || "automacao-industrial";
  var TIMEOUT_MS = C.TIMEOUT_MS || 40000;
  var busy = false;

  var LABELS = { "primeira-ligacao": "Primeira Ligação", "ligacao-de-retomada": "Ligação de Retomada" };

  /* Estado da conversa (100% no cliente; o Make e stateless - reenviamos o
     historico a cada chamada da rota "confirmado"). conv pode ser:
     idle | aguardando_confirmacao | fora_escopo | confirmado | escalado */
  var state = { conv: "idle", acao: null, acaoProposta: null, mensagemOriginal: null, historico: "" };

  var thread = document.getElementById("thread");
  var hint = document.getElementById("hint");
  var input = document.getElementById("input");
  var sendBtn = document.getElementById("send");
  var suggestEl = document.getElementById("suggest");
  var acaobadge = document.getElementById("acaobadge");
  var acaobadgeText = document.getElementById("acaobadge-text");
  document.getElementById("footer").textContent = (C.APP_NAME || "timwin") + " v" + (C.APP_VERSION || "0.0.0");
  document.getElementById("trocar-acao").addEventListener("click", function(){ resetConversation(); });
  document.getElementById("newconv").addEventListener("click", function(){ resetConversation(); });

  var STARTERS = [
    "Vou ligar para um cliente novo",
    "Preciso retomar contato com alguém",
    "Quero preparar uma reunião",
    "Quero melhorar minha abertura"
  ];
  var startersEl = document.getElementById("starters");
  function renderStarters(){
    startersEl.innerHTML = "";
    STARTERS.forEach(function(s){
      var b = document.createElement("button");
      b.textContent = s;
      b.onclick = function(){ if(!busy) send(s); };
      startersEl.appendChild(b);
    });
  }
  renderStarters();

  function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
  function fmt(s){
    return esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/\n/g,"<br>");
  }

  function addBubble(text, who, isHtml){
    if(hint){ hint.remove(); hint = null; }
    var row = document.createElement("div");
    row.className = "row " + who;
    var b = document.createElement("div");
    b.className = "bubble";
    if(isHtml){ b.innerHTML = text; } else { b.textContent = text; }
    row.appendChild(b);
    thread.appendChild(row);
    row.scrollIntoView({block:"end"});
    return row;
  }

  function renderSuggestions(list){
    if(!list || !list.length) return;
    var box = document.createElement("div");
    box.className = "suggchips";
    list.forEach(function(q){
      var b = document.createElement("button");
      b.textContent = q;
      b.onclick = function(){ if(!busy) send(q); };
      box.appendChild(b);
    });
    thread.appendChild(box);
    box.scrollIntoView({block:"end"});
  }

  /* Botoes de confirmacao/escolha: travam o fluxo ate o vendedor decidir.
     items: [{label, secondary(bool), onClick}] */
  function renderQuickReplies(items){
    var box = document.createElement("div");
    box.className = "quickreplies";
    items.forEach(function(item){
      var b = document.createElement("button");
      b.textContent = item.label;
      if(item.secondary){ b.className = "secondary"; }
      b.onclick = function(){ if(busy) return; box.remove(); item.onClick(); };
      box.appendChild(b);
    });
    thread.appendChild(box);
    box.scrollIntoView({block:"end"});
    return box;
  }

  function thinkingRow(){
    var row = document.createElement("div");
    row.className = "row bot";
    row.innerHTML = '<div class="bubble typing">Pensando<span class="dots"><i></i><i></i><i></i></span></div>';
    thread.appendChild(row);
    row.scrollIntoView({block:"end"});
    return row;
  }

  function lockComposer(locked, placeholder){
    input.disabled = locked;
    sendBtn.disabled = locked;
    input.placeholder = placeholder || "Escreva o que você pretende fazer...";
  }

  function showAcaoBadge(acao){
    acaobadgeText.textContent = LABELS[acao] || acao;
    acaobadge.style.display = "inline-flex";
  }

  function resetConversation(){
    state = { conv: "idle", acao: null, acaoProposta: null, mensagemOriginal: null, historico: "" };
    thread.innerHTML = "";
    var h = document.createElement("div");
    h.className = "empty"; h.id = "hint";
    h.innerHTML = '<div class="glyph" aria-hidden="true"><svg viewBox="0 0 574 344" xmlns="http://www.w3.org/2000/svg"><g fill="#ffffff"><rect x="0" y="0" width="100" height="100" rx="10"/><rect x="122" y="0" width="100" height="100" rx="10"/><rect x="0" y="122" width="100" height="100" rx="10"/><rect x="122" y="122" width="100" height="100" rx="10"/><rect x="0" y="244" width="100" height="100" rx="10"/><rect x="122" y="244" width="100" height="100" rx="10"/><rect x="404" y="30" width="170" height="40" rx="16"/><rect x="244" y="134" width="330" height="76" rx="20"/><rect x="244" y="256" width="330" height="76" rx="20"/></g><rect x="244" y="0" width="100" height="100" rx="10" fill="#be7931"/></svg></div><h2>Qual é o desafio de hoje?</h2><p id="hint-text">Conte rapidamente o que você pretende fazer, e eu ajudo a preparar a melhor abordagem.</p>';
    thread.appendChild(h);
    hint = h;
    acaobadge.style.display = "none";
    suggestEl.style.display = "block";
    renderStarters();
    lockComposer(false);
    input.value = ""; autoGrow();
    input.focus();
  }

  function autoGrow(){ input.style.height="auto"; input.style.height=Math.min(input.scrollHeight,130)+"px"; }
  input.addEventListener("input", autoGrow);
  input.addEventListener("keydown", function(e){
    if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); trySend(); }
  });
  sendBtn.addEventListener("click", trySend);
  function trySend(){ var t=input.value.trim(); if(t) send(t); }

  /* Chamada generica ao webhook. params = objeto de querystring.
     cb(bodyText) recebe o corpo cru da resposta (JSON ou texto plano,
     quem chama sabe qual esperar pelo estado que mandou). */
  function callWebhook(params, cb, errCb){
    var qs = Object.keys(params).map(function(k){
      return encodeURIComponent(k) + "=" + encodeURIComponent(params[k] == null ? "" : params[k]);
    }).join("&");
    var url = WEBHOOK + "?" + qs;

    var ctrl = new AbortController();
    var timedOut = false;
    var timer = setTimeout(function(){ timedOut = true; ctrl.abort(); }, TIMEOUT_MS);

    fetch(url, { method:"GET", cache:"no-store", signal:ctrl.signal })
      .then(function(r){ return r.text(); })
      .then(function(txt){ clearTimeout(timer); cb(txt); })
      .catch(function(){
        clearTimeout(timer);
        if(errCb){ errCb(timedOut); }
      });
  }

  function send(text){
    if(busy) return;
    if(!WEBHOOK){ addBubble("Configuração ausente: defina o WEBHOOK no config.js.", "bot", false); return; }
    if(state.conv !== "idle" && state.conv !== "confirmado"){
      /* nao deveria acontecer (composer fica travado nesses estados), mas por
         seguranca nao envia texto livre enquanto aguarda uma decisao por botao */
      return;
    }
    busy = true; sendBtn.disabled = true;
    suggestEl.style.display = "none";
    addBubble(text, "me", false);
    input.value=""; autoGrow();
    var t = thinkingRow();

    if(state.conv === "idle"){
      callWebhook(
        { estado:"novo", mensagem:text, disciplina:DISCIPLINA },
        function(txt){ t.remove(); busy=false; input.focus(); handleNovoResponse(txt, text); },
        function(timedOut){ t.remove(); busy=false; input.focus(); onWebhookError(timedOut); }
      );
    } else { /* confirmado */
      var acaoAtual = state.acao;
      var historicoAtual = state.historico;
      callWebhook(
        { estado:"confirmado", acao:acaoAtual, disciplina:DISCIPLINA, mensagem:text, historico:historicoAtual },
        function(txt){ t.remove(); busy=false; input.focus(); handleConfirmadoResponse(txt, text); },
        function(timedOut){ t.remove(); busy=false; input.focus(); onWebhookError(timedOut); }
      );
    }
  }

  function onWebhookError(timedOut){
    if(timedOut){
      addBubble("O timwin demorou para responder. Tente novamente em alguns instantes.", "bot", false);
    } else {
      addBubble("Falha de conexão. Verifica a internet e tenta de novo.", "bot", false);
    }
  }

  function handleNovoResponse(rawTxt, originalText){
    var resp;
    try { resp = JSON.parse(rawTxt); }
    catch(e){
      addBubble("Não consegui entender sua mensagem agora. Tenta reformular?", "bot", false);
      return;
    }
    addBubble(resp.mensagem || "...", "bot", false);

    if(resp.estado === "aguardando_confirmacao"){
      state.conv = "aguardando_confirmacao";
      state.acaoProposta = resp.acao_proposta;
      state.mensagemOriginal = originalText;
      lockComposer(true, "Toque numa opção acima para confirmar...");
      renderQuickReplies([
        { label: "Sim, é isso", onClick: function(){ confirmarMetodologia(state.acaoProposta); } },
        { label: "Não, é a outra", secondary: true, onClick: function(){
            var outra = state.acaoProposta === "primeira-ligacao" ? "ligacao-de-retomada" : "primeira-ligacao";
            confirmarMetodologia(outra);
          } }
      ]);
    } else if(resp.estado === "fora_escopo"){
      state.conv = "fora_escopo";
      state.mensagemOriginal = originalText;
      lockComposer(true, "Toque numa opção acima...");
      renderQuickReplies([
        { label: "Pode tratar como retomada", onClick: function(){ confirmarMetodologia("ligacao-de-retomada"); } },
        { label: "Prefiro falar com o Demetrius", secondary: true, onClick: function(){ escalar(); } }
      ]);
    } else {
      /* resposta inesperada: nao trava o app, deixa tentar de novo */
      state.conv = "idle";
      lockComposer(false);
    }
  }

  function confirmarMetodologia(acao){
    state.acao = acao;
    var t = thinkingRow();
    callWebhook(
      { estado:"confirmado", acao:acao, disciplina:DISCIPLINA, mensagem:state.mensagemOriginal, historico:"" },
      function(txt){
        t.remove();
        handleConfirmadoResponse(txt, state.mensagemOriginal);
        state.conv = "confirmado";
        lockComposer(false);
        showAcaoBadge(acao);
      },
      function(timedOut){ t.remove(); state.conv = "idle"; lockComposer(false); onWebhookError(timedOut); }
    );
  }

  function escalar(){
    var t = thinkingRow();
    callWebhook(
      { estado:"escalar", mensagem:state.mensagemOriginal, historico:state.historico },
      function(txt){
        t.remove();
        addBubble(txt && txt.trim() ? txt.trim() : "Beleza, avisei o Demetrius.", "bot", false);
        /* topico resolvido: libera para uma nova pergunta, mantendo o historico da tela */
        state.conv = "idle";
        state.acaoProposta = null;
        state.mensagemOriginal = null;
        lockComposer(false);
      },
      function(timedOut){ t.remove(); state.conv = "idle"; lockComposer(false); onWebhookError(timedOut); }
    );
  }

  function handleConfirmadoResponse(rawTxt, userMsg){
    var raw = (rawTxt && rawTxt.trim() && rawTxt.trim()!=="Accepted") ? rawTxt.trim()
              : "Não consegui responder agora. Tenta de novo em instantes.";
    var answer = raw, sugg = [];
    var m = raw.split("###SUGESTOES###");
    if(m.length > 1){
      answer = m[0].trim();
      sugg = m[1].split("|").map(function(x){ return x.trim(); }).filter(function(x){ return x.length; }).slice(0,3);
    }
    addBubble(fmt(answer), "bot", true);
    renderSuggestions(sugg);
    state.historico += "Vendedor: " + userMsg + "\nTimwin: " + answer + "\n\n";
  }

  if("serviceWorker" in navigator){
    window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
  }
</script>

</html>
