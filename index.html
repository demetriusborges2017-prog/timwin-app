<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>timwin</title>
<meta name="theme-color" content="#10283e" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="timwin" />
<meta name="mobile-web-app-capable" content="yes" />
<style>
  :root{
    --navy:#10283e; --navy-2:#1c3a56; --amber:#be7931; --bg:#eef1f4; --card:#ffffff;
    --ink:#132433; --muted:#6a7787; --line:#e3e8ee; --user:#10283e;
    --wrap:780px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--ink);
    display:flex; flex-direction:column; height:100dvh; overflow:hidden;
  }
  .wrap{width:100%; max-width:var(--wrap); margin:0 auto}

  /* 1. HEADER */
  header{background:var(--navy); color:#fff; box-shadow:0 1px 0 rgba(0,0,0,.08)}
  .hbar{display:flex; align-items:center; gap:12px; padding:calc(env(safe-area-inset-top) + 12px) 18px 12px}
  .brand{display:flex; align-items:center; gap:11px; min-width:0}
  .mark{width:42px;height:42px;border-radius:11px;background:rgba(255,255,255,.10);
    display:flex;align-items:center;justify-content:center;flex:0 0 42px}
  .mark svg{width:26px;height:auto;display:block}
  .bname{font-size:18px;font-weight:600;line-height:1.05;letter-spacing:.2px}
  .bsub{font-size:12px;opacity:.8;margin-top:2px}
  .hright{margin-left:auto;display:flex;align-items:center;gap:9px}
  .env{font-size:11px;font-weight:600;padding:4px 9px;border-radius:20px;
    background:rgba(190,121,49,.20);color:#f0c191;border:1px solid rgba(190,121,49,.35)}
  .user{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.12);
    display:flex;align-items:center;justify-content:center;font-size:14px;opacity:.7}
  .disc{display:flex;align-items:center;gap:7px;padding:0 18px 12px}
  .discbadge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;
    background:rgba(255,255,255,.10);padding:5px 11px;border-radius:8px}
  .discbadge .dot{width:7px;height:7px;border-radius:50%;background:var(--amber)}

  /* 2. MAIN / CHAT */
  main{flex:1; overflow-y:auto; padding:18px 16px}
  .toolbar{margin-bottom:14px}
  .seg{display:flex;gap:6px;background:#e2e8ef;padding:5px;border-radius:12px}
  .seg button{flex:1;border:0;background:transparent;color:var(--muted);font-size:13px;
    padding:8px 6px;border-radius:8px;cursor:pointer;font-weight:600;transition:.15s}
  .seg button.on{background:#fff;color:var(--navy);box-shadow:0 1px 2px rgba(0,0,0,.08)}
  #thread{display:flex;flex-direction:column;gap:11px;min-height:100%}
  .row{display:flex}
  .row.me{justify-content:flex-end}
  .bubble{max-width:88%;font-size:14.5px;line-height:1.55;padding:11px 14px;border-radius:16px;
    word-wrap:break-word;white-space:normal}
  .row.bot .bubble{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:5px;box-shadow:0 1px 2px rgba(16,40,62,.04)}
  .row.me .bubble{background:var(--user);color:#fff;border-bottom-right-radius:5px}
  .bubble strong{font-weight:600}
  .typing{display:inline-flex;gap:7px;align-items:center;padding:12px 15px;color:var(--muted);font-size:13.5px}
  .dots{display:inline-flex;gap:4px}
  .dots i{width:7px;height:7px;border-radius:50%;background:#b6c2cd;display:inline-block;animation:b 1s infinite}
  .dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
  @keyframes b{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
  /* estado vazio (boas-vindas) */
  .empty{margin:auto;text-align:center;padding:24px 22px;max-width:420px}
  .empty .glyph{width:64px;height:64px;border-radius:16px;background:var(--navy);
    display:flex;align-items:center;justify-content:center;margin:0 auto 16px}
  .empty .glyph svg{width:38px;height:auto}
  .empty h2{margin:0 0 6px;font-size:19px;font-weight:600;color:var(--ink)}
  .empty p{margin:0;color:var(--muted);font-size:14px;line-height:1.6}

  /* 3. SUGESTOES */
  .suggest{background:var(--card);border-top:1px solid var(--line);padding:12px 16px 6px}
  .suggest .lbl{font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--muted);margin:0 2px 9px}
  #starters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
  #starters button{text-align:left;border:1px solid var(--line);background:#fbfcfd;color:var(--navy);
    font-size:13px;font-weight:500;padding:11px 13px;border-radius:11px;cursor:pointer;line-height:1.35}
  #starters button:hover{border-color:#c9d4de;background:#fff}

  /* 4. ENTRADA */
  .composer-wrap{background:var(--card);border-top:1px solid var(--line);padding:10px 16px 6px}
  .composer{display:flex;gap:9px;align-items:flex-end}
  .iconbtn{width:40px;height:40px;flex:0 0 40px;border:1px solid var(--line);border-radius:12px;background:#fff;
    color:var(--muted);font-size:20px;cursor:not-allowed;display:flex;align-items:center;justify-content:center;opacity:.6}
  textarea{flex:1;resize:none;border:1px solid var(--line);border-radius:14px;padding:11px 14px;
    font:inherit;font-size:15px;max-height:130px;outline:none;background:#fff;line-height:1.4}
  textarea:focus{border-color:var(--navy-2)}
  .send{width:44px;height:44px;flex:0 0 44px;border:0;border-radius:12px;background:var(--navy);color:#fff;
    font-size:19px;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .send:disabled{opacity:.45}

  /* 5. FOOTER */
  footer{background:var(--card);border-top:1px solid var(--line);
    display:flex;align-items:center;gap:12px;flex-wrap:wrap;
    padding:9px 18px calc(env(safe-area-inset-bottom) + 9px);font-size:11.5px;color:var(--muted)}
  footer .ver{font-weight:600;color:var(--navy)}
  footer .fenv{padding:2px 8px;border-radius:12px;background:#f0e2d3;color:#8a5a1f;font-weight:600}
  footer .links{margin-left:auto;display:flex;gap:14px}
  footer .links a{color:var(--muted);text-decoration:none}
</style>
</head>
<body>

  <!-- 1. HEADER -->
  <header>
    <div class="hbar wrap">
      <div class="brand">
        <span class="mark" aria-hidden="true">
          <svg viewBox="0 0 574 344" xmlns="http://www.w3.org/2000/svg">
            <g fill="#ffffff">
              <rect x="0" y="0" width="100" height="100" rx="10"/><rect x="122" y="0" width="100" height="100" rx="10"/>
              <rect x="0" y="122" width="100" height="100" rx="10"/><rect x="122" y="122" width="100" height="100" rx="10"/>
              <rect x="0" y="244" width="100" height="100" rx="10"/><rect x="122" y="244" width="100" height="100" rx="10"/>
              <rect x="404" y="30" width="170" height="40" rx="16"/>
              <rect x="244" y="134" width="330" height="76" rx="20"/>
              <rect x="244" y="256" width="330" height="76" rx="20"/>
            </g>
            <rect x="244" y="0" width="100" height="100" rx="10" fill="#be7931"/>
          </svg>
        </span>
        <div>
          <div class="bname">timwin</div>
          <div class="bsub">Assistente Comercial Inteligente</div>
        </div>
      </div>
      <div class="hright">
        <span class="env" id="env-chip">Teste</span>
        <span class="user" title="Usuario" aria-hidden="true">&#9679;</span>
      </div>
    </div>
    <div class="disc wrap">
      <span class="discbadge"><span class="dot"></span>Automação Industrial</span>
    </div>
  </header>

  <!-- 2. MAIN / CHAT -->
  <main>
    <div class="wrap">
      <div class="toolbar">
        <div class="seg" id="seg">
          <button data-tipo="primeira" class="on">Primeira Ligação</button>
          <button data-tipo="retomada">Retomada</button>
          <button data-tipo="livre">Livre</button>
        </div>
      </div>
      <div id="thread">
        <div class="empty" id="hint">
          <div class="glyph" aria-hidden="true">
            <svg viewBox="0 0 574 344" xmlns="http://www.w3.org/2000/svg">
              <g fill="#ffffff">
                <rect x="0" y="0" width="100" height="100" rx="10"/><rect x="122" y="0" width="100" height="100" rx="10"/>
                <rect x="0" y="122" width="100" height="100" rx="10"/><rect x="122" y="122" width="100" height="100" rx="10"/>
                <rect x="0" y="244" width="100" height="100" rx="10"/><rect x="122" y="244" width="100" height="100" rx="10"/>
                <rect x="404" y="30" width="170" height="40" rx="16"/>
                <rect x="244" y="134" width="330" height="76" rx="20"/>
                <rect x="244" y="256" width="330" height="76" rx="20"/>
              </g>
              <rect x="244" y="0" width="100" height="100" rx="10" fill="#be7931"/>
            </svg>
          </div>
          <h2>Bem-vindo ao timwin</h2>
          <p>Escolha o tipo de ligação acima e faça sua pergunta. Você pode tocar numa sugestão ou escrever abaixo.</p>
        </div>
      </div>
    </div>
  </main>

  <!-- 3. SUGESTOES RAPIDAS -->
  <div class="suggest">
    <div class="wrap">
      <p class="lbl">Sugestões rápidas</p>
      <div id="starters"></div>
    </div>
  </div>

  <!-- 4. ENTRADA -->
  <div class="composer-wrap">
    <div class="wrap">
      <div class="composer">
        <button class="iconbtn" type="button" title="Anexos (em breve)" aria-label="Anexos (em breve)" disabled>+</button>
        <textarea id="input" rows="1" placeholder="Escreva sua dúvida..." autocomplete="off"></textarea>
        <button class="send" id="send" aria-label="Enviar">&#8593;</button>
      </div>
    </div>
  </div>

  <!-- 5. FOOTER -->
  <footer>
    <div class="wrap" style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
      <span class="ver" id="footer">timwin</span>
      <span class="fenv">Ambiente: Teste</span>
      <span class="links">
        <a href="#" onclick="return false">Ajuda</a>
        <a href="#" onclick="return false">Privacidade</a>
      </span>
    </div>
  </footer>

<script src="config.js"></script>
<script>
  var C = window.CONFIG || {};
  var WEBHOOK = C.WEBHOOK || "";
  var DISCIPLINA = C.DISCIPLINA || "automacao-industrial";
  var TIMEOUT_MS = C.TIMEOUT_MS || 40000;
  var tipo = "primeira";
  var busy = false;

  var thread = document.getElementById("thread");
  var hint = document.getElementById("hint");
  var input = document.getElementById("input");
  var sendBtn = document.getElementById("send");
  document.getElementById("footer").textContent = (C.APP_NAME || "timwin") + " v" + (C.APP_VERSION || "0.0.0");

  var STARTERS = [
    "Como eu abro a ligação?",
    "Como lidar com objeção?",
    "Como não parecer vendedor?",
    "E se pedir para mandar por e-mail?"
  ];
  var startersEl = document.getElementById("starters");
  STARTERS.forEach(function(s){
    var b = document.createElement("button");
    b.textContent = s;
    b.onclick = function(){ if(!busy) send(s); };
    startersEl.appendChild(b);
  });

  document.getElementById("seg").addEventListener("click", function(e){
    var b = e.target.closest("button"); if(!b) return;
    tipo = b.getAttribute("data-tipo");
    Array.prototype.forEach.call(this.children, function(c){ c.classList.remove("on"); });
    b.classList.add("on");
  });

  function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
  function fmt(s){
    return esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/\n/g,"<br>");
  }

  function addBubble(text, who, isHtml){
    if(hint){ hint.remove(); hint = null; }
    var row = document.createElement("div");
    row.className = "row " + who;
    var b = document.createElement("div");
    b.className = "bubble";
    if(isHtml){ b.innerHTML = text; } else { b.textContent = text; }
    row.appendChild(b);
    thread.appendChild(row);
    thread.scrollTop = thread.scrollHeight;
    row.scrollIntoView({block:"end"});
    return row;
  }

  function thinkingRow(){
    var row = document.createElement("div");
    row.className = "row bot";
    row.innerHTML = '<div class="bubble typing">Pensando<span class="dots"><i></i><i></i><i></i></span></div>';
    thread.appendChild(row);
    row.scrollIntoView({block:"end"});
    return row;
  }

  function autoGrow(){ input.style.height="auto"; input.style.height=Math.min(input.scrollHeight,130)+"px"; }
  input.addEventListener("input", autoGrow);
  input.addEventListener("keydown", function(e){
    if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); trySend(); }
  });
  sendBtn.addEventListener("click", trySend);
  function trySend(){ var t=input.value.trim(); if(t) send(t); }

  function send(text){
    if(busy) return;
    if(!WEBHOOK){ addBubble("Configuração ausente: defina o WEBHOOK no config.js.", "bot", false); return; }
    busy = true; sendBtn.disabled = true;
    addBubble(text, "me", false);
    input.value=""; autoGrow();
    var t = thinkingRow();

    var ctrl = new AbortController();
    var timedOut = false;
    var timer = setTimeout(function(){ timedOut = true; ctrl.abort(); }, TIMEOUT_MS);

    var url = WEBHOOK + "?pergunta=" + encodeURIComponent(text)
            + "&tipo=" + encodeURIComponent(tipo)
            + "&disciplina=" + encodeURIComponent(DISCIPLINA);

    fetch(url, { method:"GET", cache:"no-store", signal:ctrl.signal })
      .then(function(r){ return r.text(); })
      .then(function(txt){
        t.remove();
        var out = (txt && txt.trim() && txt.trim()!=="Accepted") ? txt.trim()
                  : "Não consegui responder agora. Tenta de novo em instantes.";
        addBubble(fmt(out), "bot", true);
      })
      .catch(function(){
        t.remove();
        if(timedOut){
          addBubble("O timwin demorou para responder. Tente novamente em alguns instantes.", "bot", false);
        } else {
          addBubble("Falha de conexão. Verifica a internet e tenta de novo.", "bot", false);
        }
      })
      .finally(function(){ clearTimeout(timer); busy=false; sendBtn.disabled=false; input.focus(); });
  }

  if("serviceWorker" in navigator){
    window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
  }
</script>
</body>
</html>
